name: CI

on:
  push:
    branches:
      - main
      - build/supabase-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: service_role_ci_placeholder
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      GEMINI_API_KEY: gemini_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
